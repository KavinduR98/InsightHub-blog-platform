spring.application.name=blog-backend

jwt.secret=your-256-bit-secret-key-here-make-it-at-least-32-bytes-long

# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5500/postgres
spring.datasource.username=postgres
spring.datasource.password=changemeinprod!

# Optional settings for Hibernate (if you're using JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
