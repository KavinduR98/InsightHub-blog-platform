services:
  # Our PostgresSQL database
  db:
    # Using the latest PostgresSQL image
    image: postgres:latest
    ports:
      - "5500:5432"
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changemeinprod!


  # Database management interface
  adminer:
    image: adminer:latest
    restart: always
    ports:
      - 8888:8080